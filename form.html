<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add / Edit Student - Student Information Management System</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">Student Info System</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link active" href="form.html">Add Student</a>
            </div>
            <a href="index.html" id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>
    <main class="container py-4">
        <div class="mb-4">
            <h3 class="fw-bold mb-1" id="formTitle">Add Student Form</h3>
            <p class="text-muted mb-0">Fill in student details below</p>
        </div>
        <div class="card content-card shadow-sm p-4">
            <form id="studentForm">
                <input type="hidden" id="editingOriginalId">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="studentId" class="form-label fw-semibold">Student ID</label>
                        <input type="text" class="form-control" id="studentId" placeholder="e.g., STU-004" required>
                    </div>
                    <div class="col-md-6">
                        <label for="fullName" class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control" id="fullName" placeholder="e.g., Chhun Sokha" required>
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label fw-semibold">Gender</label>
                        <select class="form-select" id="gender" required>
                            <option value="" selected disabled>Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="major" class="form-label fw-semibold">Major / Department</label>
                        <select class="form-select" id="major" required>
                            <option value="" selected disabled>Select major</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Data Analytics">Data Analytics</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select class="form-select" id="status">
                            <option value="Active" selected>Active</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="student@example.edu">
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="+855 10 000 000">
                    </div>
                    <div class="col-12">
                        <label for="address" class="form-label fw-semibold">Address</label>
                        <textarea class="form-control" id="address" rows="3" placeholder="Enter current address"></textarea>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="dashboard.html" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">Save Student</button>
                </div>
            </form>
        </div>
    </main>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
