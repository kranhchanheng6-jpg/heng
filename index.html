<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Information Management System</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-wrapper p-3">
        <div class="card login-card shadow-lg p-4">
            <div class="text-center mb-4">
                <span class="badge bg-primary-subtle text-primary mb-2 px-3 py-2">Topic 11 • Group 8</span>
                <h4 class="fw-bold mb-1">Student Info System</h4>
                <p class="text-muted small mb-0">Sign in to manage student records</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username or Email</label>
                    <input type="text" class="form-control" id="username" placeholder="admin@school.edu" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" id="forgotPasswordLink" class="text-decoration-none">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login to Dashboard</button>
            </form>
        </div>
    </div>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
