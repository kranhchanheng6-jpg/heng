<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Student Info System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar ពណ៌ខៀវ Gradient ស៊ីជាមួយទំព័រផ្សេងៗ -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #0f172a, #1e3a8a);">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard.html">Student Info System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active fw-semibold" href="dashboard.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="form.html">Add Student</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="details.html">Sample Details</a>
          </li>
        </ul>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm px-3">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <!-- ក្បាលទំព័រ និងប៊ូតុងសកម្មភាព -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div>
        <h2 class="fw-bold text-dark mb-1">Student Dashboard</h2>
        <p class="text-muted mb-0">Overview of enrolled students and academic status</p>
      </div>
      <div class="d-flex gap-2">
        <button id="resetDataBtn" class="btn btn-outline-secondary fw-semibold">Reset Sample Data</button>
        <a href="form.html" class="btn btn-primary fw-semibold shadow-sm">+ Add New Student</a>
      </div>
    </div>

    <!-- Stat Cards ៣ ប្រអប់ -->
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="card stat-card p-3" style="border-left-color: #2563eb;">
          <div class="text-muted small fw-semibold text-uppercase">Total Students</div>
          <div id="totalStudents" class="fs-2 fw-bold text-primary mt-1">3</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card p-3" style="border-left-color: #7c3aed;">
          <div class="text-muted small fw-semibold text-uppercase">Active Departments</div>
          <div id="activeDepartments" class="fs-2 fw-bold mt-1" style="color: #7c3aed;">2</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card p-3" style="border-left-color: #10b981;">
          <div class="text-muted small fw-semibold text-uppercase">Active Students</div>
          <div id="activeStudents" class="fs-2 fw-bold text-success mt-1">1</div>
        </div>
      </div>
    </div>

    <!-- តារាង Student Directory -->
    <div class="card content-card p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h5 class="fw-bold text-dark mb-0">Student Directory</h5>
        <div class="d-flex flex-wrap gap-2">
          <input id="searchInput" type="text" class="form-control form-control-sm" placeholder="Search ID, Name, Major..." style="width: 220px;">
          <select id="statusFilter" class="form-select form-select-sm" style="width: 150px;">
            <option value="All">All Status</option>
            <option value="Active">Active</option>
            <option value="Pending">Pending</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Full Name</th>
              <th>Gender</th>
              <th>Major / Class</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js"></script>
  <script>
    
    function enhanceDashboardUI() {
      const tbody = document.getElementById("studentTableBody");
      if (!tbody) return;

      tbody.querySelectorAll("tr").forEach((row) => {
        const cells = row.querySelectorAll("td");
        if (cells.length >= 5) {
          const statusCell = cells[4];
          const statusText = statusCell.textContent.trim();
          if (statusText && !statusCell.querySelector(".badge")) {
            const lower = statusText.toLowerCase();
            let badgeClass = "bg-secondary-subtle text-secondary border border-secondary-subtle";
            if (lower === "active") {
              badgeClass = "bg-success-subtle text-success border border-success-subtle";
            } else if (lower === "pending") {
              badgeClass = "bg-warning-subtle text-warning-emphasis border border-warning-subtle";
            } else if (lower === "inactive") {
              badgeClass = "bg-danger-subtle text-danger border border-danger-subtle";
            }
            statusCell.innerHTML = `<span class="badge ${badgeClass} px-3 py-2">${statusText}</span>`;
          }
        }

        const actionCell = cells[cells.length - 1];
        if (actionCell) {
          actionCell.classList.add("text-end");
          actionCell.querySelectorAll("a, button").forEach((btn) => {
            const label = btn.textContent.trim().toLowerCase();
            btn.classList.add("btn", "btn-sm", "fw-semibold", "me-1");
            if (label === "view") {
              btn.classList.add("btn-outline-primary");
            } else if (label === "edit") {
              btn.classList.add("btn-outline-warning");
            } else if (label === "delete") {
              btn.classList.add("btn-outline-danger");
            }
          });
        }
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(enhanceDashboardUI, 50);
      const tbody = document.getElementById("studentTableBody");
      if (tbody) {
        new MutationObserver(enhanceDashboardUI).observe(tbody, { childList: true, subtree: true });
      }
    });
  </script>
</body>
</html>
