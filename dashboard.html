<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Information Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">Student Info System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="form.html">Add Student</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="details.html?id=STU-001">Sample Details</a>
                    </li>
                </ul>
                <span class="text-light small me-3" id="currentUserBadge"></span>
                <a href="index.html" id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <div>
                <h3 class="fw-bold mb-1">Student Dashboard</h3>
                <p class="text-muted mb-0">Overview of enrolled students and academic status</p>
            </div>
            <div class="d-flex gap-2">
                <button type="button" id="resetDataBtn" class="btn btn-outline-secondary">Reset Sample Data</button>
                <a href="form.html" class="btn btn-primary">+ Add New Student</a>
            </div>
        </div>
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card shadow-sm p-3">
                    <div class="text-muted small">Total Students</div>
                    <div class="fs-3 fw-bold text-primary" id="totalStudentsCount">3</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm p-3">
                    <div class="text-muted small">Active Departments</div>
                    <div class="fs-3 fw-bold text-success" id="activeDepartmentsCount">3</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm p-3">
                    <div class="text-muted small">Active Students</div>
                    <div class="fs-3 fw-bold text-info" id="activeStudentsCount">2</div>
                </div>
            </div>
        </div>
        <div class="card content-card shadow-sm">
            <div class="card-header bg-white py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h5 class="mb-0 fw-semibold">Student Directory</h5>
                <div class="d-flex gap-2">
                    <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search ID, Name, Major...">
                    <select id="statusFilter" class="form-select form-select-sm">
                        <option value="All">All Status</option>
                        <option value="Active">Active</option>
                        <option value="Pending">Pending</option>
                    </select>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Gender</th>
                            <th>Major / Class</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>

</html>
